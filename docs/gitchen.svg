<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#241a38"/>
      <stop offset="100%" stop-color="#0c0814"/>
    </radialGradient>
    <radialGradient id="body" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b887e6"/>
      <stop offset="55%" stop-color="#7c45ad"/>
      <stop offset="100%" stop-color="#4a2270"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9dffb0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9dffb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tether" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fe3a3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6fe3a3" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="node" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d9f7e2"/>
      <stop offset="60%" stop-color="#5fb784"/>
      <stop offset="100%" stop-color="#2c6b48"/>
    </radialGradient>
  </defs>

  <rect width="640" height="480" fill="url(#sky)"/>

  <!-- faint starfield -->
  <g fill="#cdb8f0" opacity="0.5">
    <circle cx="60" cy="50" r="1.4"/><circle cx="120" cy="90" r="1"/>
    <circle cx="560" cy="60" r="1.6"/><circle cx="500" cy="30" r="1"/>
    <circle cx="40" cy="220" r="1.2"/><circle cx="600" cy="180" r="1"/>
    <circle cx="300" cy="25" r="1.1"/><circle cx="380" cy="55" r="1.3"/>
  </g>

  <!-- vision cone from the gitchen's sensor eyes, watching over the swarm -->
  <polygon points="255,185 60,460 260,460" fill="#9dffb0" opacity="0.06"/>
  <polygon points="385,185 580,460 380,460" fill="#9dffb0" opacity="0.06"/>

  <!-- tethers down to the swarm it supports -->
  <path d="M250,300 C230,360 190,400 150,430" stroke="url(#tether)" stroke-width="3" fill="none"/>
  <path d="M300,320 C290,370 270,410 245,445" stroke="url(#tether)" stroke-width="3" fill="none"/>
  <path d="M340,320 C350,370 370,410 395,445" stroke="url(#tether)" stroke-width="3" fill="none"/>
  <path d="M390,300 C410,360 450,400 490,430" stroke="url(#tether)" stroke-width="3" fill="none"/>

  <!-- the swarm: small hive nodes, each lit by the gitchen's vision -->
  <g>
    <circle cx="150" cy="432" r="16" fill="url(#node)"/>
    <circle cx="245" cy="447" r="14" fill="url(#node)"/>
    <circle cx="395" cy="447" r="14" fill="url(#node)"/>
    <circle cx="490" cy="432" r="16" fill="url(#node)"/>
    <circle cx="320" cy="458" r="12" fill="url(#node)"/>
  </g>

  <!-- the gitchen: a central organism, body + gasbags, held aloft -->
  <ellipse cx="150" cy="215" rx="55" ry="40" fill="url(#body)" opacity="0.85"/>
  <ellipse cx="490" cy="215" rx="55" ry="40" fill="url(#body)" opacity="0.85"/>
  <ellipse cx="320" cy="150" rx="150" ry="95" fill="url(#body)"/>
  <ellipse cx="320" cy="160" rx="115" ry="60" fill="#8f57bf" opacity="0.5"/>

  <!-- dorsal ridges -->
  <g stroke="#3a1c58" stroke-width="4" fill="none" opacity="0.55">
    <path d="M220,95 C230,130 230,170 215,205"/>
    <path d="M280,78 C292,120 292,175 278,218"/>
    <path d="M360,78 C348,120 348,175 362,218"/>
    <path d="M420,95 C410,130 410,170 425,205"/>
  </g>

  <!-- sensor eyes: the vision this organism provides the hive -->
  <circle cx="255" cy="150" r="26" fill="url(#glow)"/>
  <circle cx="385" cy="150" r="26" fill="url(#glow)"/>
  <circle cx="255" cy="150" r="11" fill="#eafff1"/>
  <circle cx="385" cy="150" r="11" fill="#eafff1"/>
  <circle cx="255" cy="150" r="5" fill="#133"/>
  <circle cx="385" cy="150" r="5" fill="#133"/>

  <!-- bioluminescent veins carrying signal outward -->
  <g stroke="#9dffb0" stroke-width="1.6" fill="none" opacity="0.7">
    <path d="M255,176 C240,200 220,215 195,222"/>
    <path d="M385,176 C400,200 420,215 445,222"/>
    <path d="M300,180 C300,210 300,235 300,255"/>
    <path d="M340,180 C340,210 340,235 340,255"/>
  </g>
</svg>
