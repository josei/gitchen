# Example machine config. Copy to ~/.config/gitchen/config.yml (or point
# $GITCHEN_CONFIG at it). Project repos only name model aliases
# (small/medium/big); what those mean, which CLI runs them, and what sandbox
# they run in is decided here, once per machine.
harness: omp

harnesses:
  omp:
    settings:
      binary: omp
    sandbox:
      # gitchen ships this profile (profiles/gitchen.json) and installs it
      # into nono's profile directory on first use, with this platform's
      # port policy filled in. Any other name is a profile the machine
      # already has.
      profile: gitchen
      # The profile grants ~/.npm read-only (node_runtime); npm ci writes.
      allow: ["~/.npm"]
      allow_domains: [api.deepinfra.com, registry.npmjs.org]
    # sandbox: false          # opt out entirely: turns run unsandboxed

  claude-code:
    settings:
      binary: claude
      permission_mode: bypassPermissions
    sandbox:
      profile: gitchen
      allow: ["~/.npm"]
      allow_domains: [registry.npmjs.org]

models:
  small:
    omp: {model: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash-1017, thinking: low}
    claude-code: {model: claude-haiku-5-5}
  medium:
    omp: {model: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash-1017, thinking: auto}
    claude-code: {model: claude-sonnet-5-5}
  big:
    omp: {model: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash-1017, thinking: high}
    claude-code: {model: claude-opus-5-5}
